<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Learn Forms in Html</title>
</head>
<body>
    <h1>
        Form to apply for interview
    </h1>
    <form action="post">
        <div>
            <label for="
            name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your Name">
        </div>
        <div>
            <input type="radio" id="Male" name="Gender" value="Male">
            <label for="Male"> Male </label>
            <input type="radio" id="Female" name="Gender" value="Female">
            <label for="Female">Female</label>
            <input type="radio" name="Gender" id="Trans" value="Trans">
            <label for="Trans">Trans</label>
        </div>
        <div>
            <label for="role">Select Your Role</label>
            <select name="role" id="role" >
                <option value="1">Frontend Developer</option>
                <option value="2">Backend Developer</option>
                <option value="3">Full-Stack Developer</option>
            </select>
        </div>
        <div>
            <div>
                <label for="brief">Tell us about yourself</label>
            </div>
            <textarea name="Brief" id="brief" rows="5" cols="100" autofocus>
            </textarea>
        </div>

    </form>
</body>
</html>
